services:
  postgres:
    image: postgres:17-alpine
    container_name: contextclip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contextclip}
      POSTGRES_USER: ${POSTGRES_USER:-contextclip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: contextclip_postgres_data
