server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # API reverse proxy
    # -----------------------------------------------------------------------
    # All /api/* requests are forwarded to the Spring Boot backend.
    # In Docker Compose, the backend service is reachable at http://backend:8080
    # by default. Override via BACKEND_URL env var if needed (Phase 9B).
    #
    # Note: nginx does not expand shell env vars in conf files without
    # envsubst.  The hostname 'backend' is the Compose service name and
    # must match the service name defined in docker-compose.yml.
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # -----------------------------------------------------------------------
    # React SPA — client-side routing fallback
    # -----------------------------------------------------------------------
    # All non-file requests fall back to index.html so React Router (or
    # internal navigation state) can handle the route on the client side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------------
    # Static asset caching
    # -----------------------------------------------------------------------
    # Vite hashes asset filenames (e.g. index-Dd5-u7FJ.js), so long-lived
    # cache headers are safe for assets inside the /assets/ directory.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
